<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0d253f"/>
      <stop offset="100%" stop-color="#020c1b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Animated Dynamic Elements (Background Waves & Pulse Circles) -->
  <g opacity="0.4">
    <circle cx="150" cy="150" r="100" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6">
      <animateTransform attributeName="transform" type="rotate" from="0 150 150" to="360 150 150" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="150" r="120" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="360 1050 150" to="0 1050 150" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Dynamic Energy Flow Lines (Subtle in background) -->
  <path d="M 50 220 Q 300 120 600 220 T 1150 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="20s" repeatCount="indefinite"/>
  </path>

  <!-- Building Outlines Background Graphic -->
  <g transform="translate(820, 90)" opacity="0.35">
    <rect x="0" y="70" width="45" height="110" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="55" y="30" width="55" height="150" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="120" y="90" width="40" height="90" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1.5"/>
    <rect x="170" y="50" width="60" height="130" fill="url(#greenGrad)" stroke="#34d399" stroke-width="1.5"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(80, 125)">
    <!-- Badge -->
    <rect x="0" y="-75" width="220" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="110" y="-56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle" letter-spacing="1">⚡ ENERGY ANALYTICS &amp; BEMS</text>

    <!-- Main Title -->
    <text x="0" y="-10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#ffffff" filter="url(#glow)">
      Awesome Building Energy Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
      Curated List of SaaS Platforms, Enterprise Solutions &amp; Open-Source Projects 🏢⚡🌱
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="65" y="17" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">⚡ HVAC Optimization</text>

      <rect x="140" y="0" width="140" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="210" y="17" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🔍 Fault Detection (FDD)</text>

      <rect x="290" y="0" width="120" height="26" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="350" y="17" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">🌱 Smart Grid / EMS</text>
    </g>
  </g>
</svg>
